name: Publish to npm
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run review
      - name: Check release version
        id: release
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const {name,version}=JSON.parse(fs.readFileSync('package.json'));
          const response=await fetch(`https://registry.npmjs.org/${name}/${version}`);
          if (![200,404].includes(response.status)) throw new Error(`Registry check failed: ${response.status}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `publish=${response.status===404}\n`);
          JS
      - name: Publish with provenance
        if: steps.release.outputs.publish == 'true'
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
